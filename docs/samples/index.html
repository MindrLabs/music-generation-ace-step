@font-face { font-family: "Pretendard Variable"; src: local("Pretendard Variable"), local("Pretendard"); font-weight: 45 920; font-display: swap; }
:root, [data-theme="dark"] {
  --bg: #000000;
  --surface-100: #111111;
  --surface-200: #292929;
  --ink: #ffffff;
  --ink-2: #e7e7e7;
  --muted: #a7a7a7;
  --rule: #a7a7a7;
  --rule-soft: rgba(255, 255, 255, 0.5);
  --on-ink: #000000;
  --scrim: rgba(0, 0, 0, 0.75);
  --positive: #4ade80;
  --negative: #f87171;
  --caution: #fbbf24;
  --shadow-card: 10px 10px 30px #000000;
  --shadow-title: 24px 24px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff;
    --surface-100: #f1f1f1;
    --surface-200: #e7e7e7;
    --ink: #000000;
    --ink-2: #292929;
    --muted: #6b6b6b;
    --rule: #c6c8ca;
    --rule-soft: rgba(0, 0, 0, 0.3);
    --on-ink: #ffffff;
    --positive: #15803d;
    --negative: #b91c1c;
    --caution: #a16207;
    --shadow-card: 10px 10px 30px rgba(0, 0, 0, 0.12);
    color-scheme: light;
  }
}

[data-theme="light"] {
  --bg: #ffffff;
  --surface-100: #f1f1f1;
  --surface-200: #e7e7e7;
  --ink: #000000;
  --ink-2: #292929;
  --muted: #6b6b6b;
  --rule: #c6c8ca;
  --rule-soft: rgba(0, 0, 0, 0.3);
  --on-ink: #ffffff;
  --positive: #15803d;
  --negative: #b91c1c;
  --caution: #a16207;
  --shadow-card: 10px 10px 30px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}

:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-20: 80px;
  --radius-tag: 5px;
  --radius-sm: 8px;
  --radius-card: 30px;
  --radius-pill: 999px;
  --stroke-hairline: 1px;
  --stroke-strong: 2px;
  --stroke-focus: 2px;
  --stroke-icon: 1.5px;
  --opacity-disabled: 0.5;
  --opacity-hover: 0.7;
  --opacity-scrim: 0.75;
  --font-display: "Bebas Neue", "Pretendard Variable", Impact, "Arial Narrow", sans-serif;
  --font-sans: "Pretendard Variable", Pretendard, "SUIT", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "D2Coding", monospace;
}
/* Hairline components: plain CSS classes for static HTML pages. Load after tokens.css. */

.hl-page {
  background: var(--bg);
  color: var(--ink-2);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.hl-page :focus-visible {
  outline: var(--stroke-focus, 2px) solid var(--ink);
  outline-offset: 3px;
}

/* Heading. Page title: the H1 in the display face, no ornament. */
.hl-title {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 96px;
  font-weight: 400;
  line-height: 0.9;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

/* Display heading: the same face below the H1. */
.hl-display {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.hl-display--md { font-size: 40px; line-height: 1; }

/* Korean heading: Pretendard in the title style, for headings Bebas Neue cannot set. */
.hl-heading {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 24px;
  font-weight: 600;
  line-height: 32px;
  letter-spacing: -0.025em;
  text-wrap: balance;
}

@media (max-width: 600px) {
  .hl-title { font-size: 56px; }
  .hl-display { font-size: 44px; }
  .hl-display--md { font-size: 32px; }
}

/* Eyebrow and navigation label. */
.hl-label {
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: 0.02em;
}

/* Icon: a 20px line icon from the Hairline set, drawn in currentColor. */
.hl-icon {
  display: inline-block;
  flex: none;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--stroke-icon, 1.5px);
  vertical-align: middle;
}

.hl-icon--sm { width: 16px; height: 16px; }

/* Link: nav link with a growing underline; inline and arrow variants. */
.hl-link {
  position: relative;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 0.02em;
  text-decoration: none;
}

.hl-link::after {
  content: "";
  display: block;
  width: 0;
  height: var(--stroke-strong, 2px);
  background: var(--ink);
  transition: width var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-link:hover::after,
.hl-link[aria-current="true"]::after,
.hl-link[aria-current="page"]::after { width: 100%; }

.hl-link:focus-visible {
  outline: var(--stroke-focus, 2px) solid var(--ink);
  outline-offset: 3px;
}

.hl-link--inline {
  font-family: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  text-decoration: underline;
  text-decoration-thickness: var(--stroke-hairline, 1px);
  text-decoration-color: var(--muted);
  text-underline-offset: 0.2em;
  transition: text-decoration-color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-link--inline::after { content: none; }
.hl-link--inline:hover { text-decoration-color: var(--ink); }

.hl-link--arrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.hl-link--arrow::after { content: none; }

.hl-link__arrow {
  flex: none;
  width: 20px;
  height: 10px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--stroke-icon, 1.5px);
  transition: transform var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-link--arrow:hover .hl-link__arrow { transform: translateX(6px); }

/* Button: outlined pill that inverts on hover. */
.hl-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 28px;
  border: var(--stroke-hairline, 1px) solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color var(--duration-invert, 500ms) var(--ease, ease), color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-button:hover,
.hl-button--solid {
  background: var(--ink);
  color: var(--on-ink);
}

.hl-button--solid:hover {
  background: transparent;
  color: var(--ink);
}

.hl-button:disabled {
  border-color: var(--rule);
  background: transparent;
  color: var(--muted);
  cursor: not-allowed;
}

.hl-button:focus-visible {
  outline: var(--stroke-focus, 2px) solid var(--ink);
  outline-offset: 3px;
}

.hl-button__arrow {
  width: 20px;
  height: 10px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--stroke-icon, 1.5px);
}

/* IconButton: the button's round sibling, one line icon and an aria-label. */
.hl-icon-button {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 48px;
  height: 48px;
  padding: 0;
  border: var(--stroke-hairline, 1px) solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background-color var(--duration-invert, 500ms) var(--ease, ease), color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-icon-button:hover,
.hl-icon-button--solid {
  background: var(--ink);
  color: var(--on-ink);
}

.hl-icon-button--solid:hover {
  background: transparent;
  color: var(--ink);
}

.hl-icon-button:disabled {
  border-color: var(--rule);
  background: transparent;
  color: var(--muted);
  cursor: not-allowed;
}

.hl-icon-button:focus-visible {
  outline: var(--stroke-focus, 2px) solid var(--ink);
  outline-offset: 3px;
}

.hl-icon-button svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--stroke-icon, 1.5px);
}

/* Tag: solid ink chip with heavy small text. */
.hl-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 12px;
  overflow: hidden;
  border-radius: var(--radius-tag);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.025em;
  text-transform: uppercase;
  white-space: nowrap;
}

.hl-tag--outline {
  border: var(--stroke-hairline, 1px) solid var(--rule);
  background: transparent;
  color: var(--muted);
}

.hl-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

/* Status: a state as dot plus word. */
.hl-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  line-height: 20px;
}

.hl-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.hl-status--positive { color: var(--positive); }
.hl-status--negative { color: var(--negative); }
.hl-status--caution { color: var(--caution); }
.hl-status--pending { color: var(--muted); }
.hl-status--pending::before { background: transparent; box-shadow: inset 0 0 0 var(--stroke-icon, 1.5px) currentColor; }

/* Card: one item on a raised surface. */
.hl-card {
  display: grid;
  gap: 24px;
  padding: 32px;
  border-radius: var(--radius-card);
  background: var(--surface-100);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

.hl-card__head {
  display: grid;
  gap: 8px;
  padding-bottom: 16px;
  border-bottom: var(--stroke-hairline, 1px) solid var(--rule-soft);
}

.hl-card__title {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.hl-card__meta {
  margin: 0;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 20px;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .hl-card { padding: 24px 20px; border-radius: var(--radius-card); }
  .hl-card__title { font-size: 32px; }
}

/* SegmentedControl (class hl-choice): one-of picker as a row of pills. */
.hl-choice {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 0;
  border: 0;
}

.hl-choice legend {
  margin-bottom: 8px;
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.02em;
}

.hl-choice input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.hl-choice label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  border: var(--stroke-hairline, 1px) solid var(--rule);
  border-radius: var(--radius-pill);
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--duration-fill, 300ms) var(--ease, ease), color var(--duration-fill, 300ms) var(--ease, ease), border-color var(--duration-fill, 300ms) var(--ease, ease);
}

.hl-choice label::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 var(--stroke-icon, 1.5px) currentColor;
}

.hl-choice label:hover { border-color: var(--ink); color: var(--ink); }
.hl-choice input:focus-visible + label { outline: var(--stroke-focus, 2px) solid var(--ink); outline-offset: 3px; }
.hl-choice input:checked + label { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.hl-choice input:checked + label.hl-choice--positive::before { background: var(--positive); box-shadow: none; }
.hl-choice input:checked + label.hl-choice--negative::before { background: var(--negative); box-shadow: none; }
.hl-choice input:checked + label.hl-choice--caution::before { background: var(--caution); box-shadow: none; }
.hl-choice input:disabled + label { cursor: default; }

/* Joined segments: one outlined pill split into parts, no dots. */
.hl-choice--joined { flex-wrap: nowrap; gap: 0; }
.hl-choice--joined label { border-radius: 0; margin-left: calc(var(--stroke-hairline, 1px) * -1); }
.hl-choice--joined label::before { content: none; }
.hl-choice--joined label:first-of-type { margin-left: 0; border-radius: var(--radius-pill) 0 0 var(--radius-pill); }
.hl-choice--joined label:last-of-type { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }
.hl-choice--joined label:hover,
.hl-choice--joined input:checked + label { position: relative; z-index: 1; }

/* Chip: a selectable filter pill; any number may be on. */
.hl-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.hl-chip {
  position: relative;
  display: inline-flex;
  cursor: pointer;
}

.hl-chip__label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  box-sizing: border-box;
  padding: 0 16px;
  border: var(--stroke-hairline, 1px) solid var(--rule);
  border-radius: var(--radius-pill);
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  transition: background-color var(--duration-fill, 300ms) var(--ease, ease), color var(--duration-fill, 300ms) var(--ease, ease), border-color var(--duration-fill, 300ms) var(--ease, ease);
}

.hl-chip:hover .hl-chip__label { border-color: var(--ink); color: var(--ink); }
.hl-chip input:checked + .hl-chip__label { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }

.hl-chip input:checked + .hl-chip__label::before {
  content: "";
  width: 4px;
  height: 8px;
  margin: -3px 2px 0 0;
  border: solid currentColor;
  border-width: 0 var(--stroke-strong, 2px) var(--stroke-strong, 2px) 0;
  transform: rotate(45deg);
}

.hl-chip input:focus-visible + .hl-chip__label { outline: var(--stroke-focus, 2px) solid var(--ink); outline-offset: 3px; }
.hl-chip:has(input:disabled) { cursor: not-allowed; }
.hl-chip input:disabled + .hl-chip__label { opacity: var(--opacity-disabled, 0.5); }

/* TextField (class hl-field): a labelled textarea or input. */
.hl-field {
  display: grid;
  gap: 8px;
  min-width: 0;
}

.hl-field label {
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.02em;
}

.hl-field textarea,
.hl-field input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 16px;
  border: var(--stroke-hairline, 1px) solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  resize: vertical;
}

.hl-field textarea::placeholder,
.hl-field input::placeholder { color: var(--muted); }
.hl-field textarea:focus-visible,
.hl-field input:focus-visible { border-color: var(--ink); outline: none; }
.hl-field textarea[readonly] { border-style: dashed; color: var(--ink-2); }
.hl-field [aria-invalid="true"] { border-color: var(--negative); }

.hl-field__hint {
  color: var(--muted);
  font-size: 13px;
  line-height: 20px;
}

.hl-field__error {
  color: var(--negative);
  font-size: 13px;
  font-weight: 700;
  line-height: 20px;
}

/* Checkbox: a 20px box that fills with ink, the input kept for the keyboard. */
.hl-check {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  color: var(--ink-2);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  cursor: pointer;
}

.hl-check input,
.hl-switch input,
.hl-chip input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  pointer-events: none;
}

.hl-check__box {
  position: relative;
  flex: none;
  width: 20px;
  height: 20px;
  box-sizing: border-box;
  border: var(--stroke-hairline, 1px) solid var(--muted);
  border-radius: var(--radius-tag);
  transition: background-color var(--duration-fill, 300ms) var(--ease, ease), border-color var(--duration-fill, 300ms) var(--ease, ease);
}

.hl-check__box::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 5px;
  height: 10px;
  border: solid var(--on-ink);
  border-width: 0 var(--stroke-strong, 2px) var(--stroke-strong, 2px) 0;
  transform: rotate(45deg);
  opacity: 0;
}

.hl-check:hover .hl-check__box { border-color: var(--ink); }
.hl-check input:checked + .hl-check__box { border-color: var(--ink); background: var(--ink); }
.hl-check input:checked + .hl-check__box::after { opacity: 1; }
.hl-check input:focus-visible + .hl-check__box { outline: var(--stroke-focus, 2px) solid var(--ink); outline-offset: 3px; }
.hl-check:has(input:disabled) { color: var(--muted); cursor: not-allowed; }
.hl-check input:disabled + .hl-check__box { border-style: dashed; opacity: var(--opacity-disabled, 0.5); }

/* Switch: an outlined pill track whose thumb crosses and inverts. */
.hl-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  color: var(--ink-2);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  cursor: pointer;
}

.hl-switch__track {
  position: relative;
  flex: none;
  width: 48px;
  height: 28px;
  box-sizing: border-box;
  border: var(--stroke-hairline, 1px) solid var(--muted);
  border-radius: var(--radius-pill);
  transition: background-color var(--duration-invert, 500ms) var(--ease, ease), border-color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--duration-invert, 500ms) var(--ease, ease), background-color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-switch:hover .hl-switch__track { border-color: var(--ink); }
.hl-switch input:checked + .hl-switch__track { border-color: var(--ink); background: var(--ink); }
.hl-switch input:checked + .hl-switch__track::after { transform: translateX(20px); background: var(--on-ink); }
.hl-switch input:focus-visible + .hl-switch__track { outline: var(--stroke-focus, 2px) solid var(--ink); outline-offset: 3px; }
.hl-switch:has(input:disabled) { color: var(--muted); cursor: not-allowed; }
.hl-switch input:disabled + .hl-switch__track { border-style: dashed; opacity: var(--opacity-disabled, 0.5); }

/* Select: a native select dressed as a field, with a drawn chevron. */
.hl-select {
  display: grid;
  gap: 8px;
  min-width: 0;
}

.hl-select label {
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.02em;
}

.hl-select__box {
  position: relative;
  display: block;
}

.hl-select select {
  appearance: none;
  width: 100%;
  min-height: 48px;
  box-sizing: border-box;
  padding: 12px 48px 12px 16px;
  border: var(--stroke-hairline, 1px) solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 24px;
  cursor: pointer;
  transition: border-color var(--duration-fill, 300ms) var(--ease, ease);
}

.hl-select select:hover,
.hl-select select:focus-visible { border-color: var(--ink); outline: none; }
.hl-select select:disabled { border-style: dashed; color: var(--muted); cursor: not-allowed; }
.hl-select option { background: var(--surface-100); color: var(--ink); }

.hl-select__box::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 20px;
  width: 8px;
  height: 8px;
  border: solid var(--ink);
  border-width: 0 var(--stroke-icon, 1.5px) var(--stroke-icon, 1.5px) 0;
  transform: translateY(-75%) rotate(45deg);
  pointer-events: none;
}

/* NavBar: display-face brand and links over a hairline. */
.hl-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 48px;
  padding: 24px 0;
  border-bottom: var(--stroke-hairline, 1px) solid var(--rule);
}

.hl-nav__brand {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 32px;
  line-height: 1;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: opacity var(--duration-fill, 300ms) var(--ease, ease);
}

.hl-nav__brand:hover { opacity: var(--opacity-hover, 0.7); }

.hl-nav__links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 48px;
  margin: 0 0 0 auto;
  padding: 0;
  list-style: none;
}

.hl-nav .hl-link {
  display: inline-block;
  color: var(--muted);
  transition: color var(--duration-row, 400ms) var(--ease, ease);
}

.hl-nav .hl-link:hover,
.hl-nav .hl-link[aria-current="page"],
.hl-nav .hl-link[aria-current="true"] { color: var(--ink); }

@media (max-width: 600px) {
  .hl-nav__links { gap: 8px 24px; margin-left: 0; }
}

/* Tabs: display-face labels on a hairline, the selected one underlined. */
.hl-tabs {
  display: flex;
  gap: 32px;
  overflow-x: auto;
  box-shadow: inset 0 calc(var(--stroke-hairline, 1px) * -1) 0 var(--rule);
  scrollbar-width: none;
}

.hl-tabs__tab {
  position: relative;
  flex: none;
  padding: 12px 0 14px;
  border: 0;
  background: none;
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.2;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: color var(--duration-row, 400ms) var(--ease, ease);
}

.hl-tabs__tab::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: var(--stroke-strong, 2px);
  background: var(--ink);
  transition: width var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-tabs__tab:hover,
.hl-tabs__tab[aria-selected="true"] { color: var(--ink); }
.hl-tabs__tab[aria-selected="true"]::after { width: 100%; }
.hl-tabs__tab:focus-visible { outline: var(--stroke-focus, 2px) solid var(--ink); outline-offset: -2px; }

.hl-tabs__panel { padding-top: 24px; }
.hl-tabs__panel[hidden] { display: none; }

/* Notice: one line that needs attention. */
.hl-notice {
  display: flex;
  gap: 12px;
  align-items: baseline;
  padding: 12px 16px;
  border: var(--stroke-hairline, 1px) solid currentColor;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 22px;
}

.hl-notice--caution { color: var(--caution); }
.hl-notice--negative { color: var(--negative); }
.hl-notice p { margin: 0; color: var(--ink-2); }
.hl-notice strong { flex: none; font-weight: 700; }

/* Toast: an ink pill that says what just happened, then fades. */
.hl-toast-region {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  display: grid;
  justify-items: center;
  gap: 8px;
  width: max-content;
  max-width: calc(100vw - 32px);
  transform: translateX(-50%);
  pointer-events: none;
}

.hl-toast {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  min-height: 48px;
  box-sizing: border-box;
  padding: 8px 24px;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  line-height: 20px;
  pointer-events: auto;
  transition: opacity var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-toast--leaving { opacity: 0; }

.hl-toast__close {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 32px;
  height: 32px;
  margin-right: -16px;
  padding: 0;
  border: var(--stroke-hairline, 1px) solid currentColor;
  border-radius: var(--radius-pill);
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background-color var(--duration-invert, 500ms) var(--ease, ease), color var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-toast__close:hover { background: var(--on-ink); color: var(--ink); }
.hl-toast__close:focus-visible { outline: var(--stroke-focus, 2px) solid var(--on-ink); outline-offset: 2px; }

.hl-toast__close svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--stroke-icon, 1.5px);
}

/* Progress: an ink bar over a hairline, determinate or running. */
.hl-progress {
  display: grid;
  gap: 8px;
  min-width: 0;
}

.hl-progress__head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.hl-progress__value { color: var(--ink); }

.hl-progress__track {
  position: relative;
  height: 4px;
  overflow: hidden;
}

.hl-progress__track::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-top: var(--stroke-hairline, 1px) solid var(--rule);
  transform: translateY(-50%);
}

.hl-progress__bar {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background: var(--ink);
  transition: width var(--duration-invert, 500ms) var(--ease, ease);
}

.hl-progress--indeterminate .hl-progress__bar {
  width: 30%;
  animation: hl-progress-run var(--duration-loop, 1500ms) linear infinite;
}
